# YOLOv12-seg 🚀, AGPL-3.0 license
# YOLOv12 instance segmentation model with P3/8 - P5/32 outputs
# Modified to use C2PSA blocks for PE ablation study

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov12n-seg.yaml' will call yolov12-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: ~355 layers, ~2.9M parameters
  s: [0.50, 0.50, 1024] # summary: ~355 layers, ~10.1M parameters
  m: [0.50, 1.00, 512] # summary: ~445 layers, ~22.4M parameters
  l: [1.00, 1.00, 512] # summary: ~667 layers, ~27.7M parameters
  x: [1.00, 1.50, 512] # summary: ~667 layers, ~62.1M parameters

# YOLOv12-seg backbone (modified to use C2PSA for PE ablation)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2,  [512, True]]
  - [-1, 1, Conv,  [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2,  [1024, True]]
  - [-1, 1, SPPF,  [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 - Uses Attention modules for PE ablation

# YOLOv12-seg head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C2PSA, [512]] # 13 - Uses Attention modules

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C2PSA, [256]] # 16 (P3/8-small) - Uses Attention modules

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C2PSA, [512]] # 19 (P4/16-medium) - Uses Attention modules

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C2PSA, [1024]] # 22 (P5/32-large) - Uses Attention modules

  - [[16, 19, 22], 1, Segment, [nc, 32, 256]] # Segment(P3, P4, P5)

